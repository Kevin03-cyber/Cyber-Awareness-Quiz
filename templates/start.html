<!DOCTYPE html>
<html lang="en">
<head>

    <title>Cyber Awareness Challenge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="home">
    <div class="glow glow-1"></div>

    <main class="hero">

            <p class="line l1">$ scanning your cyber skills...</p>

        <a href="/quiz" class="start-btn">Start the challenge</a>

        <div class="topics">
            <span>🎣 Phishing</span>
            <span>🔑 Passwords</span>

            <span>🌐 Safe browsing</span>
